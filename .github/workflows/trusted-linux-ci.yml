name: Debug layout benchmark jobs

# This isolated experiment rejects every event/ref except its manual branch.
on:
  workflow_call:
    inputs:
      debug_layout:
        type: string
        required: false
        default: separate
      self_hosted:
        type: boolean
        required: false
        default: false
      build_ffmpeg_aar:
        type: boolean
        required: false
        default: false
      build_cache:
        type: boolean
        required: false
        default: true
      cache_read_only:
        type: boolean
        required: false
        default: false
      unit_parallel:
        type: boolean
        required: false
        default: false
      unit_worker_limit:
        type: number
        required: false
        default: 2
      unit_shared_test_forks:
        type: number
        required: false
        default: 1
      lint_parallel:
        type: boolean
        required: false
        default: false
      lint_worker_limit:
        type: number
        required: false
        default: 2

permissions:
  contents: read

env:
  SILO_CI_DEBUG_LAYOUT: ${{ inputs.debug_layout }}
  SILO_CI_CACHE_FLAG: ${{ inputs.build_cache && '--build-cache' || '--no-build-cache' }}
  # This controller isolates worker scheduling with configuration cache off.
  SILO_CI_CONFIGURATION_FLAG: --no-configuration-cache
  # Pass a literal string to action inputs and record the same policy decision.
  # Internal PR writes stay scoped to their merge ref; forks remain read-only.
  SILO_CI_CACHE_READ_ONLY: ${{ !inputs.cache_read_only && inputs.build_cache && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && 'false' || 'true' }}

jobs:
  changes:
    name: Select CI work
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      schema: ${{ steps.route.outputs.schema }}
      mode: ${{ steps.route.outputs.mode }}
      unit_tests: ${{ steps.route.outputs.unit_tests }}
      lint: ${{ steps.route.outputs.lint }}
      release_readiness: ${{ steps.route.outputs.release_readiness }}
      ffmpeg_aar: ${{ steps.route.outputs.ffmpeg_aar }}

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Require the isolated manual benchmark
        run: python3 scripts/ci-debug-benchmark.py guard
        env:
          SILO_CI_UNIT_WORKERS: ${{ inputs.unit_worker_limit }}
          SILO_CI_LINT_WORKERS: ${{ inputs.lint_worker_limit }}
          SILO_CI_UNIT_PARALLEL: ${{ inputs.unit_parallel }}
          SILO_CI_LINT_PARALLEL: ${{ inputs.lint_parallel }}
          SILO_CI_SHARED_FORKS: ${{ inputs.unit_shared_test_forks }}

      - name: Check build supply chain and CI scripts
        run: |
          ./scripts/test-check-build-supply-chain.sh
          ./scripts/check-build-supply-chain.sh
          ./scripts/test-release-workflow.sh
          python3 scripts/test-ci-routing.py -v
          python3 scripts/test-ci-result.py -v
          python3 scripts/test-ci-gradle.py
          python3 scripts/test-ci-debug-benchmark.py

      - name: Select validation jobs
        id: route
        run: python3 scripts/ci-routing.py
        env:
          SILO_CI_FFMPEG_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ffmpeg_aar && 'true' || 'false' }}

  ffmpeg-aar:
    name: Media3 FFmpeg AAR
    needs: changes
    if: needs.changes.outputs.ffmpeg_aar == 'true'
    runs-on: ${{ inputs.self_hosted && (github.repository == 'Silo-Server/silo-android' && ((github.event_name == 'pull_request' && contains(fromJSON(vars.SILO_CI_MEMBERS || '[]'), github.event.pull_request.user.login)) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))) && fromJSON(format('["self-hosted","linux","x64","silo-linux","silo-run-{0}-{1}","silo-job-ffmpeg-aar"]', github.run_id, github.run_attempt)) || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned native toolchain
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Build FFmpeg decoder extension
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/26.3.11579264"
          ./scripts/build-ffmpeg-aar.sh

      - name: Verify packaged ABIs and renderer
        shell: bash
        run: |
          set -euo pipefail
          aar="android-shared/libs/media3-decoder-ffmpeg-1.11.0.aar"
          unzip -l "${aar}" | grep -F "jni/arm64-v8a/libffmpegJNI.so"
          unzip -l "${aar}" | grep -F "jni/armeabi-v7a/libffmpegJNI.so"
          unzip -l "${aar}" | grep -F "jni/x86_64/libffmpegJNI.so"
          unzip -p "${aar}" classes.jar > /tmp/media3-ffmpeg-classes.jar
          unzip -l /tmp/media3-ffmpeg-classes.jar | \
            grep -F "androidx/media3/decoder/ffmpeg/FfmpegAudioRenderer.class"
          readelf="${ANDROID_HOME}/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="/tmp/libffmpegJNI-${abi}.so"
            unzip -p "${aar}" "jni/${abi}/libffmpegJNI.so" > "${so}"
            "${readelf}" -lW "${so}" | python3 -c '
          import sys
          alignments = [
              int(line.split()[-1], 16)
              for line in sys.stdin
              if line.lstrip().startswith("LOAD ")
          ]
          if not alignments or min(alignments) < 0x4000:
              raise SystemExit(f"ELF LOAD alignment is below 16 KB: {alignments}")
          '
          done
          sha256sum "${aar}"

      - name: Upload FFmpeg AAR
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: media3-decoder-ffmpeg-1.11.0
          path: android-shared/libs/media3-decoder-ffmpeg-1.11.0.aar
          if-no-files-found: error

  release-readiness:
    name: Release readiness
    needs: changes
    if: needs.changes.outputs.release_readiness == 'true'
    # R8 memory tuning is a separate experiment; this profile varies unit/lint only.
    env:
      SILO_CI_WORKER_LIMIT: "2"
      SILO_CI_PARALLEL_FLAG: --no-parallel
    runs-on: ${{ inputs.self_hosted && (github.repository == 'Silo-Server/silo-android' && ((github.event_name == 'pull_request' && contains(fromJSON(vars.SILO_CI_MEMBERS || '[]'), github.event.pull_request.user.login)) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))) && fromJSON(format('["self-hosted","linux","x64","silo-linux","silo-run-{0}-{1}","silo-job-release-readiness"]', github.run_id, github.run_attempt)) || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # Match release.yml: the pinned Ruby and frozen lockfile must work
      # before a release reaches the Google Play job.
      - name: Set up Ruby and install release dependencies
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true

      - name: Load the release lane and Play client
        run: |
          bundle exec fastlane lanes
          bundle exec ruby -e "require 'supply'"
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "true"
          FASTLANE_OPT_OUT_USAGE: "true"

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          # Writes are scoped to the default branch, manual runs requiring write
          # access, or internal PRs from an explicit trusted association.
          # Forks retain read-only access and cannot seed another ref's cache.
          cache-read-only: ${{ env.SILO_CI_CACHE_READ_ONLY }}

      - name: Record build inputs
        run: ./scripts/ci-build-metadata.py

      # Exercise both Play artifacts, including R8 and bundle packaging.
      # Signing and publishing remain in release.yml.
      - name: Build phone and TV release bundles
        run: |
          ./scripts/ci-gradle.py --max-workers "${SILO_CI_WORKER_LIMIT}" -- ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -Pandroid.r8.maxWorkers=1 \
            :androidApp:bundleRelease :androidTvApp:bundleRelease \
            "${SILO_CI_CACHE_FLAG}" "${SILO_CI_PARALLEL_FLAG}" "${SILO_CI_CONFIGURATION_FLAG}"
          test -s androidApp/build/outputs/bundle/release/androidApp-release.aab
          test -s androidTvApp/build/outputs/bundle/release/androidTvApp-release.aab

      - name: Upload Gradle profile
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: gradle-profile-release-readiness
          path: build/reports/profile/*.html
          retention-days: 7
          if-no-files-found: warn

  unit-tests:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.unit_tests == 'true' && inputs.debug_layout == 'separate'
    outputs:
      unit_proof: ${{ steps.coverage.outputs.unit_proof }}
      lint_proof: ${{ steps.coverage.outputs.lint_proof }}
    env:
      SILO_CI_WORKER_LIMIT: ${{ inputs.unit_worker_limit }}
      SILO_CI_PARALLEL_FLAG: ${{ inputs.unit_parallel && '--parallel' || '--no-parallel' }}
      SILO_CI_ANDROID_SHARED_TEST_FORKS: ${{ inputs.unit_shared_test_forks }}
    runs-on: ${{ inputs.self_hosted && (github.repository == 'Silo-Server/silo-android' && ((github.event_name == 'pull_request' && contains(fromJSON(vars.SILO_CI_MEMBERS || '[]'), github.event.pull_request.user.login)) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))) && fromJSON(format('["self-hosted","linux","x64","silo-linux","silo-run-{0}-{1}","silo-job-unit-tests"]', github.run_id, github.run_attempt)) || 'ubuntu-latest' }}

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          # Writes are scoped to the default branch, manual runs requiring write
          # access, or internal PRs from an explicit trusted association.
          # Forks retain read-only access and cannot seed another ref's cache.
          cache-read-only: ${{ env.SILO_CI_CACHE_READ_ONLY }}

      - name: Record build inputs
        run: ./scripts/ci-build-metadata.py

      # Robolectric does NOT resolve its Android runtimes through Gradle. At test
      # execution time it fetches android-all-instrumented straight from Maven
      # Central into ~/.m2, which setup-gradle's cache does not cover — so every
      # run re-downloaded 85-204 MB per SDK level. On 2026-08-11 Maven Central
      # answered 403 and took out 31 unrelated tests in android-shared, and the
      # download time is a large part of this job.
      #
      # Which runtimes get fetched depends on the Robolectric version AND on the
      # SDK each test resolves to, so the key hashes the version catalogue and
      # the module build files (min/target SDK) together. A new @Config(sdk=NN)
      # in a test is deliberately NOT in the key: hashing test sources would
      # bust this cache on nearly every pull request, which costs more than it
      # saves. The residual gap is bounded — that one runtime is re-fetched each
      # run until something else moves the key — and the restore-key prefix
      # still seeds from the previous cache rather than starting cold.
      #
      # A run-id-suffixed key would close the gap by saving every run, but this
      # cache is hundreds of MB; a new entry per run would evict the Gradle
      # cache against the repository's 10 GB budget.
      - name: Cache Robolectric Android runtimes
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Record coverage start
        run: python3 scripts/ci-debug-benchmark.py start --kind unit

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          # CI exercises debug variants; release.yml retains the host tests for
          # distinct release behavior and BuildConfig values.
          ./scripts/ci-gradle.py --max-workers "${SILO_CI_WORKER_LIMIT}" -- ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            testDebugUnitTest \
            "${SILO_CI_CACHE_FLAG}" "${SILO_CI_PARALLEL_FLAG}" "${SILO_CI_CONFIGURATION_FLAG}"

          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = sorted(Path('.').glob('*/build/test-results/testDebugUnitTest/TEST-*.xml'))
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          if not reports:
              raise SystemExit('No JUnit reports were produced')
          for report in reports:
              suite = ET.parse(report).getroot()
              if suite.tag != 'testsuite':
                  raise SystemExit(f'Invalid JUnit suite: {report}')
              cases = suite.findall('testcase')
              actual = {'tests': len(cases), **{
                  key: sum(case.find(tag) is not None for case in cases)
                  for key, tag in (('failures', 'failure'), ('errors', 'error'), ('skipped', 'skipped'))
              }}
              for key in totals:
                  count = int(suite.attrib[key])
                  if count != actual[key]:
                      raise SystemExit(f'Inconsistent JUnit {key}: {report}')
                  totals[key] += count
          if totals['tests'] == 0 or totals['failures'] or totals['errors']:
              raise SystemExit(f'JUnit validation failed: {totals}')
          print('SILO_CI_TEST_TOTALS ' + json.dumps({**totals, 'reports': len(reports)}, sort_keys=True))
          PY

      - name: Verify frozen debug coverage
        id: coverage
        run: python3 scripts/ci-debug-benchmark.py coverage --kind unit

      - name: Preserve original debug evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: debug-benchmark-unit-evidence
          path: |
            .ci-debug-benchmark/*.json
            **/build/test-results/testDebugUnitTest/TEST-*.xml
            **/build/reports/tests/testDebugUnitTest/**
            **/build/reports/lint-results-debug.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Gradle profile
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: gradle-profile-unit-tests
          path: build/reports/profile/*.html
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true' && inputs.debug_layout == 'separate'
    outputs:
      unit_proof: ${{ steps.coverage.outputs.unit_proof }}
      lint_proof: ${{ steps.coverage.outputs.lint_proof }}
    env:
      SILO_CI_WORKER_LIMIT: ${{ inputs.lint_worker_limit }}
      SILO_CI_PARALLEL_FLAG: ${{ inputs.lint_parallel && '--parallel' || '--no-parallel' }}
    runs-on: ${{ inputs.self_hosted && (github.repository == 'Silo-Server/silo-android' && ((github.event_name == 'pull_request' && contains(fromJSON(vars.SILO_CI_MEMBERS || '[]'), github.event.pull_request.user.login)) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main'))) && fromJSON(format('["self-hosted","linux","x64","silo-linux","silo-run-{0}-{1}","silo-job-lint"]', github.run_id, github.run_attempt)) || 'ubuntu-latest' }}

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          # Writes are scoped to the default branch, manual runs requiring write
          # access, or internal PRs from an explicit trusted association.
          # Forks retain read-only access and cannot seed another ref's cache.
          cache-read-only: ${{ env.SILO_CI_CACHE_READ_ONLY }}

      - name: Record build inputs
        run: ./scripts/ci-build-metadata.py

      - name: Record coverage start
        run: python3 scripts/ci-debug-benchmark.py start --kind lint

      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail

          # NewApi and InlinedApi are fatal here. Two startup crashes reached
          # users because nothing checked API levels: a Spatializer call gated
          # at 31 for a class introduced at 32, and an unguarded API 28 call.
          # Existing findings are held in per-module lint-baseline.xml, so only
          # NEW violations fail. If this job fails, fix the call — do not
          # regenerate the baseline to make it pass.
          #
          # Release readiness builds both release bundles, which run fatal
          # release lint. The final Android CI gate requires that job too.
          ./scripts/ci-gradle.py --max-workers "${SILO_CI_WORKER_LIMIT}" -- ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :android-shared:lintDebug :androidApp:lintDebug :androidTvApp:lintDebug \
            "${SILO_CI_CACHE_FLAG}" "${SILO_CI_PARALLEL_FLAG}" "${SILO_CI_CONFIGURATION_FLAG}"

      - name: Verify frozen debug coverage
        id: coverage
        run: python3 scripts/ci-debug-benchmark.py coverage --kind lint

      - name: Preserve original debug evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: debug-benchmark-lint-evidence
          path: |
            .ci-debug-benchmark/*.json
            **/build/test-results/testDebugUnitTest/TEST-*.xml
            **/build/reports/tests/testDebugUnitTest/**
            **/build/reports/lint-results-debug.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Gradle profile
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: gradle-profile-lint
          path: build/reports/profile/*.html
          retention-days: 7
          if-no-files-found: warn

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore

  combined-debug:
    name: Combined debug validation
    needs: changes
    if: needs.changes.outputs.unit_tests == 'true' && inputs.debug_layout == 'combined'
    outputs:
      unit_proof: ${{ steps.coverage.outputs.unit_proof }}
      lint_proof: ${{ steps.coverage.outputs.lint_proof }}
    env:
      SILO_CI_WORKER_LIMIT: ${{ inputs.unit_worker_limit }}
      # One invocation shares unit_parallel across Tests and lint. lint_parallel
      # records the separate layout baseline and cannot govern this union.
      SILO_CI_PARALLEL_FLAG: ${{ inputs.unit_parallel && '--parallel' || '--no-parallel' }}
      SILO_CI_ANDROID_SHARED_TEST_FORKS: ${{ inputs.unit_shared_test_forks }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          # Writes are scoped to the default branch, manual runs requiring write
          # access, or internal PRs from an explicit trusted association.
          # Forks retain read-only access and cannot seed another ref's cache.
          cache-read-only: ${{ env.SILO_CI_CACHE_READ_ONLY }}

      - name: Record build inputs
        run: ./scripts/ci-build-metadata.py

      # Robolectric does NOT resolve its Android runtimes through Gradle. At test
      # execution time it fetches android-all-instrumented straight from Maven
      # Central into ~/.m2, which setup-gradle's cache does not cover — so every
      # run re-downloaded 85-204 MB per SDK level. On 2026-08-11 Maven Central
      # answered 403 and took out 31 unrelated tests in android-shared, and the
      # download time is a large part of this job.
      #
      # Which runtimes get fetched depends on the Robolectric version AND on the
      # SDK each test resolves to, so the key hashes the version catalogue and
      # the module build files (min/target SDK) together. A new @Config(sdk=NN)
      # in a test is deliberately NOT in the key: hashing test sources would
      # bust this cache on nearly every pull request, which costs more than it
      # saves. The residual gap is bounded — that one runtime is re-fetched each
      # run until something else moves the key — and the restore-key prefix
      # still seeds from the previous cache rather than starting cold.
      #
      # A run-id-suffixed key would close the gap by saving every run, but this
      # cache is hundreds of MB; a new entry per run would evict the Gradle
      # cache against the repository's 10 GB budget.
      - name: Cache Robolectric Android runtimes
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Record coverage start
        run: python3 scripts/ci-debug-benchmark.py start --kind combined

      - name: Run combined debug validation
        shell: bash
        run: |
          set -euo pipefail

          # CI exercises debug variants; release.yml retains the host tests for
          # distinct release behavior and BuildConfig values.
          ./scripts/ci-gradle.py --max-workers "${SILO_CI_WORKER_LIMIT}" -- ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            testDebugUnitTest \
            :android-shared:lintDebug :androidApp:lintDebug :androidTvApp:lintDebug \
            "${SILO_CI_CACHE_FLAG}" "${SILO_CI_PARALLEL_FLAG}" "${SILO_CI_CONFIGURATION_FLAG}"

          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = sorted(Path('.').glob('*/build/test-results/testDebugUnitTest/TEST-*.xml'))
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          if not reports:
              raise SystemExit('No JUnit reports were produced')
          for report in reports:
              suite = ET.parse(report).getroot()
              if suite.tag != 'testsuite':
                  raise SystemExit(f'Invalid JUnit suite: {report}')
              cases = suite.findall('testcase')
              actual = {'tests': len(cases), **{
                  key: sum(case.find(tag) is not None for case in cases)
                  for key, tag in (('failures', 'failure'), ('errors', 'error'), ('skipped', 'skipped'))
              }}
              for key in totals:
                  count = int(suite.attrib[key])
                  if count != actual[key]:
                      raise SystemExit(f'Inconsistent JUnit {key}: {report}')
                  totals[key] += count
          if totals['tests'] == 0 or totals['failures'] or totals['errors']:
              raise SystemExit(f'JUnit validation failed: {totals}')
          print('SILO_CI_TEST_TOTALS ' + json.dumps({**totals, 'reports': len(reports)}, sort_keys=True))
          PY

      - name: Verify frozen debug coverage
        id: coverage
        run: python3 scripts/ci-debug-benchmark.py coverage --kind combined

      - name: Preserve original debug evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: debug-benchmark-combined-evidence
          path: |
            .ci-debug-benchmark/*.json
            **/build/test-results/testDebugUnitTest/TEST-*.xml
            **/build/reports/tests/testDebugUnitTest/**
            **/build/reports/lint-results-debug.*
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Gradle profile
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: gradle-profile-combined-debug
          path: build/reports/profile/*.html
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: combined-test-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore

  android-ci:
    name: Debug layout benchmark result
    if: always()
    needs: [changes, unit-tests, lint, combined-debug, release-readiness, ffmpeg-aar]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require every selected validation job to succeed
        run: python3 scripts/ci-debug-benchmark.py result
        env:
          SILO_CI_NEEDS_JSON: ${{ toJSON(needs) }}
