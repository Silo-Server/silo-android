name: Android Builds

# CI gate: unit tests on main pushes and pull requests. Release artifacts
# (Play Store bundles, sideload APKs, GitHub releases) are owned by
# release.yml — triggered by v* tags or its workflow_dispatch.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_ffmpeg_aar:
        description: Build the pinned Media3 FFmpeg decoder AAR instead of app jobs
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg-aar:
    name: Media3 FFmpeg AAR
    if: github.event_name == 'workflow_dispatch' && inputs.build_ffmpeg_aar
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned native toolchain
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Build FFmpeg decoder extension
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/26.3.11579264"
          ./scripts/build-ffmpeg-aar.sh

      - name: Verify packaged ABIs and renderer
        shell: bash
        run: |
          set -euo pipefail
          aar="android-shared/libs/media3-decoder-ffmpeg-1.11.0.aar"
          unzip -l "${aar}" | grep -F "jni/arm64-v8a/libffmpegJNI.so"
          unzip -l "${aar}" | grep -F "jni/armeabi-v7a/libffmpegJNI.so"
          unzip -l "${aar}" | grep -F "jni/x86_64/libffmpegJNI.so"
          unzip -p "${aar}" classes.jar > /tmp/media3-ffmpeg-classes.jar
          unzip -l /tmp/media3-ffmpeg-classes.jar | \
            grep -F "androidx/media3/decoder/ffmpeg/FfmpegAudioRenderer.class"
          readelf="${ANDROID_HOME}/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            so="/tmp/libffmpegJNI-${abi}.so"
            unzip -p "${aar}" "jni/${abi}/libffmpegJNI.so" > "${so}"
            "${readelf}" -lW "${so}" | python3 -c '
          import sys
          alignments = [
              int(line.split()[-1], 16)
              for line in sys.stdin
              if line.lstrip().startswith("LOAD ")
          ]
          if not alignments or min(alignments) < 0x4000:
              raise SystemExit(f"ELF LOAD alignment is below 16 KB: {alignments}")
          '
          done
          sha256sum "${aar}"

      - name: Upload FFmpeg AAR
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: media3-decoder-ffmpeg-1.11.0
          path: android-shared/libs/media3-decoder-ffmpeg-1.11.0.aar
          if-no-files-found: error

  unit-tests:
    name: Unit tests
    if: github.event_name != 'workflow_dispatch' || !inputs.build_ffmpeg_aar
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check build supply chain
        run: |
          ./scripts/test-check-build-supply-chain.sh
          ./scripts/check-build-supply-chain.sh

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      # Robolectric does NOT resolve its Android runtimes through Gradle. At test
      # execution time it fetches android-all-instrumented straight from Maven
      # Central into ~/.m2, which setup-gradle's cache does not cover — so every
      # run re-downloaded 85-204 MB per SDK level. On 2026-08-11 Maven Central
      # answered 403 and took out 31 unrelated tests in android-shared, and the
      # download time is a large part of this job.
      #
      # Which runtimes get fetched depends on the Robolectric version AND on the
      # SDK each test resolves to, so the key hashes the version catalogue and
      # the module build files (min/target SDK) together. A new @Config(sdk=NN)
      # in a test is deliberately NOT in the key: hashing test sources would
      # bust this cache on nearly every pull request, which costs more than it
      # saves. The residual gap is bounded — that one runtime is re-fetched each
      # run until something else moves the key — and the restore-key prefix
      # still seeds from the previous cache rather than starting cold.
      #
      # A run-id-suffixed key would close the gap by saving every run, but this
      # cache is hundreds of MB; a new entry per run would evict the Gradle
      # cache against the repository's 10 GB budget.
      - name: Cache Robolectric Android runtimes
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail

          # Debug-variant unit tests only. The release variant compiles and runs
          # the exact same sources for no extra signal, and doubles CI time.
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            testDebugUnitTest \
            --max-workers=2

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/**
          if-no-files-found: ignore

  lint:
    name: Lint
    if: github.event_name != 'workflow_dispatch' || !inputs.build_ffmpeg_aar
    runs-on: ubuntu-latest

    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail

          # NewApi and InlinedApi are fatal here. Two startup crashes reached
          # users because nothing checked API levels: a Spatializer call gated
          # at 31 for a class introduced at 32, and an unguarded API 28 call.
          # Existing findings are held in per-module lint-baseline.xml, so only
          # NEW violations fail. If this job fails, fix the call — do not
          # regenerate the baseline to make it pass.
          #
          # lintVitalRelease runs here too. checkReleaseBuilds makes it part of
          # assembleRelease, which only ever runs from release.yml on a v* tag —
          # so without this the release variant is gated by a check that no pull
          # request exercises, and the first run would be mid-release. It also
          # covers the release-only source sets that lintDebug never sees.
          ./gradlew \
            -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" \
            :android-shared:lintDebug :androidApp:lintDebug :androidTvApp:lintDebug \
            :androidApp:lintVitalRelease :androidTvApp:lintVitalRelease \
            --max-workers=2

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore
