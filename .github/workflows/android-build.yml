name: Android debug layout benchmark

# Private branch experiment; expensive jobs require the exact manual ref.

on:
  workflow_dispatch:
    inputs:
      debug_layout:
        description: Keep separate debug jobs or measure one combined invocation
        required: false
        default: separate
        type: choice
        options:
          - separate
          - combined
      build_ffmpeg_aar:
        description: Build the pinned Media3 FFmpeg decoder AAR instead of app jobs
        required: false
        default: false
        type: boolean
      build_cache:
        description: Reuse Gradle task outputs (disable for a baseline measurement)
        required: false
        default: true
        type: boolean
      cache_read_only:
        description: Restore fixed Gradle cache state without saving during layout profiling
        required: false
        default: true
        type: boolean
      unit_parallel:
        description: Benchmark parallel project execution for unit tests
        required: false
        default: false
        type: boolean
      unit_worker_limit:
        description: Unit test workers for the qualified two-worker experiment
        required: false
        default: "2"
        type: choice
        options:
          - "2"
      unit_shared_test_forks:
        description: Test forks for android-shared debug unit tests only
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
      lint_parallel:
        description: Benchmark parallel project execution for lint
        required: false
        default: false
        type: boolean
      lint_worker_limit:
        description: Lint workers for the qualified two-worker experiment
        required: false
        default: "2"
        type: choice
        options:
          - "2"

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Hosted PR validation must exercise the proposed workflow revision. The
    # runner group's main-only restriction still applies to self-hosted calls.
    uses: ./.github/workflows/trusted-linux-ci.yml
    with:
      self_hosted: false
      debug_layout: ${{ inputs.debug_layout }}
      build_ffmpeg_aar: ${{ inputs.build_ffmpeg_aar || false }}
      build_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.build_cache }}
      cache_read_only: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_read_only }}
      unit_parallel: ${{ inputs.unit_parallel || false }}
      unit_worker_limit: ${{ fromJSON(inputs.unit_worker_limit || '2') }}
      unit_shared_test_forks: ${{ fromJSON(inputs.unit_shared_test_forks || '1') }}
      lint_parallel: ${{ inputs.lint_parallel || false }}
      lint_worker_limit: ${{ fromJSON(inputs.lint_worker_limit || '2') }}
