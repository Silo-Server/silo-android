name: Android Builds

# CI gate: tests, lint, and release readiness on main pushes and pull requests.
# Release artifacts (Play Store bundles, sideload APKs, GitHub releases) are owned by
# release.yml — triggered by v* tags or its workflow_dispatch.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      build_ffmpeg_aar:
        description: Build the pinned Media3 FFmpeg decoder AAR instead of app jobs
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: Silo-Server/silo-android/.github/workflows/trusted-linux-ci.yml@main
    with:
      self_hosted: ${{ github.repository == 'Silo-Server/silo-android' && ((github.event_name == 'pull_request' && contains(fromJSON(vars.SILO_CI_MEMBERS || '[]'), github.event.pull_request.user.login)) || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')) }}
      build_ffmpeg_aar: ${{ inputs.build_ffmpeg_aar || false }}
