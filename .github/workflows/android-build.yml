name: Android Builds

# CI gate: tests, lint, and release readiness on main pushes and pull requests.
# Release artifacts (Play Store bundles, sideload APKs, GitHub releases) are owned by
# release.yml — triggered by v* tags or its workflow_dispatch.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      play_bundle_diagnostic:
        description: Run the private synthetic bundle and inert upload qualification
        type: boolean
        default: false
      reject_first_download:
        description: Interrupt the first inert consumer to check partial rerun recovery
        type: boolean
        default: true
      failure_gate:
        description: Deliberately fail a completed diagnostic gate
        type: choice
        options: [none, unit-tests, lint, prepare]
        default: none
      build_ffmpeg_aar:
        description: Build the pinned Media3 FFmpeg decoder AAR instead of app jobs
        required: false
        default: false
        type: boolean
      build_cache:
        description: Reuse Gradle task outputs (disable for a baseline measurement)
        required: false
        default: true
        type: boolean
      parallel:
        description: Benchmark parallel project execution at the existing worker limit
        required: false
        default: false
        type: boolean
      configuration_cache:
        description: Check configuration-cache compatibility without publishing artifacts
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'workflow_dispatch' || !inputs.play_bundle_diagnostic
    # Hosted PR validation must exercise the proposed workflow revision. The
    # runner group's main-only restriction still applies to self-hosted calls.
    uses: ./.github/workflows/trusted-linux-ci.yml
    with:
      self_hosted: false
      build_ffmpeg_aar: ${{ inputs.build_ffmpeg_aar || false }}
      build_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.build_cache }}
      parallel: ${{ inputs.parallel || false }}
      configuration_cache: ${{ inputs.configuration_cache || false }}

  play-bundle-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.play_bundle_diagnostic
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/play-bundle-diagnostic.yml
    with:
      reject_first_download: ${{ inputs.reject_first_download }}
      failure_gate: ${{ inputs.failure_gate }}
